name = "lilka-catalog-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Public base URL of this Worker; file links in the export are built from it
PUBLIC_URL = "https://lilka-catalog-api.black-ghost-ukraine.workers.dev"
GITHUB_CLIENT_ID = "Ov23li85TrkxrZwn00ZP"
# Comma-separated list of sites allowed to call the API and to receive a login
# Local development adds http://localhost:8000 and :5173 in .dev.vars
ALLOWED_ORIGINS = "https://catalog.lilka.dev,https://lilka-dev.github.io"
# Comma-separated GitHub numeric user ids that get the moderator role on sign-in.
# Ids, not logins: a login is freed by a rename and can be taken by anyone.
# Find one with: curl -s https://api.github.com/users/<login> | jq .id
MODERATORS = "70693212" # black-ghost-off
# Repo that runs the ClamAV scan workflow (repository_dispatch "scan-version")
SCAN_REPO = "lilka-dev/catalog-api"
# Repo rebuilt after an approval (repository_dispatch "api-sync")
CATALOG_REPO = "lilka-dev/catalog"

# Secrets (set with `wrangler secret put <NAME>`, or in .dev.vars locally):
#   GITHUB_CLIENT_SECRET  - OAuth App secret
#   SCAN_SECRET           - shared with the scan workflow
#   GITHUB_DISPATCH_TOKEN - fine-grained token allowed to dispatch to SCAN_REPO and CATALOG_REPO

[[d1_databases]]
binding = "DB"
database_name = "lilka-catalog"
database_id = "11565ea5-5387-430f-9326-b99acb5dcc78"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "lilka-catalog-files"

[triggers]
crons = ["0 3 * * *"]
