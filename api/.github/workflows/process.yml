name: Process uploads

# Scans new versions with ClamAV and generates icon_min, compressed images and
# package.zip (scripts/process.py). The Worker dispatches `scan-version` right
# after an upload; the schedule catches anything a lost dispatch left behind.
on:
  repository_dispatch:
    types: [scan-version]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: process
  cancel-in-progress: false

# The job only reads this repo; it reaches the API with SCAN_SECRET
permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install and start ClamAV daemon
        # The daemon loads the signatures once; clamscan would reload them per file
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-daemon
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          sudo systemctl start clamav-daemon
          for i in $(seq 1 30); do
            clamdscan --ping 1 2>/dev/null && break
            echo "Waiting for clamd... ($i/30)"
            sleep 2
          done

      - name: Process pending versions
        env:
          # Same default as the catalog's deploy workflow; set the variable only to point elsewhere
          API_URL: ${{ vars.API_URL || 'https://lilka-catalog-api.black-ghost-ukraine.workers.dev' }}
          SCAN_SECRET: ${{ secrets.SCAN_SECRET }}
        run: python3 scripts/process.py
