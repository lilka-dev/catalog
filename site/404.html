<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not found · Lilka Apps & Mods</title>
    <!-- GitHub Pages serves this file for any missing path, at any depth: links are absolute -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .not-found {
            max-width: 560px;
            margin: 4rem auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }
        .not-found-code {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            color: var(--primary-color);
        }
        .not-found p {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-bar">
            <a class="brand" href="/">
                <span class="brand-mark" aria-hidden="true">🎮</span>
                <span class="brand-text">
                    <span class="brand-name">Lilka <span class="brand-name-extra">Apps &amp; Mods</span></span>
                </span>
            </a>
        </div>
    </header>

    <main class="container">
        <div class="not-found">
            <div class="not-found-code">404</div>
            <h1>Сторінку не знайдено</h1>
            <p>Можливо, застосунок приховали або адреса змінилася.</p>
            <p lang="en">Page not found. The app may have been hidden, or the address changed.</p>
            <a class="download-btn" href="/">До каталогу · Back to the catalog</a>
        </div>
    </main>
</body>
</html>
