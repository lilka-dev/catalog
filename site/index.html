<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilka Apps & Mods</title>
    <!--
        Sign-in tokens live in localStorage, so any script that gets onto this
        page could read them. The policy only lets scripts come from this site,
        cdnjs (pinned files with integrity hashes below) and the analytics
        host, and never from inline code or attributes. The site therefore has
        no inline event handlers; see the image error listener in script.js.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data: blob: http://localhost:8787; connect-src 'self' https://lilka-catalog-api.black-ghost-ukraine.workers.dev https://api.github.com https://raw.githubusercontent.com https://cloud.umami.is https://gateway.umami.is http://localhost:8787; object-src 'none'; base-uri 'none'; form-action 'none'">
    <!-- lilka-catalog-api base URL; empty keeps sign-in and publishing hidden -->
    <meta name="lilka-api" content="https://lilka-catalog-api.black-ghost-ukraine.workers.dev">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-bar">
            <a class="brand" href="./">
                <span class="brand-mark" aria-hidden="true">🎮</span>
                <span class="brand-text">
                    <span class="brand-name">Lilka <span class="brand-name-extra">Apps &amp; Mods</span></span>
                    <span class="brand-tagline" data-i18n="subtitle">Games, tools, and modifications for the Lilka DIY console</span>
                </span>
            </a>
            <div class="header-actions">
                <!-- My apps and Moderation live in the account menu (community.js) -->
                <button class="tab-button community-tab publish-btn" data-type="share" data-i18n="tab-share" hidden>Publish</button>
                <div class="account" id="account" hidden></div>
                <div class="lang-switcher" id="langSwitcher" role="group" aria-label="Language">
                    <button class="lang-btn" data-lang="uk" title="Українська">УКР</button>
                    <button class="lang-btn" data-lang="en" title="English">ENG</button>
                </div>
            </div>
        </div>
        <nav class="tabs">
            <div class="container tabs-row">
                <button class="tab-button active" data-type="apps" data-i18n="tab-apps">Apps</button>
                <button class="tab-button" data-type="wallpapers" data-i18n="tab-wallpapers">Wallpapers</button>
                <button class="tab-button" data-type="mods" data-i18n="tab-mods">Mods</button>
                <button class="tab-button" data-type="authors" data-i18n="tab-authors">Authors</button>
            </div>
        </nav>
    </header>

    <main class="container">
        <div id="loading" class="loading" data-i18n="loading">Loading...</div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="content">
            <!-- Pagination in the middle, sorting on the right -->
            <div class="list-head">
                <div class="pagination">
                    <button id="prevPage" class="btn" disabled>←</button>
                    <div id="pageNumbers" class="page-numbers"></div>
                    <button id="nextPage" class="btn" disabled>→</button>
                </div>

                <div class="list-toolbar">
                    <label for="sortSelect" data-i18n="sort-label">Sort by</label>
                    <select id="sortSelect">
                        <option value="newest" data-i18n="sort-newest">Newest</option>
                        <option value="updated" data-i18n="sort-updated">Recently updated</option>
                        <option value="rating" data-i18n="sort-rating">Top rated</option>
                        <option value="name" data-i18n="sort-name">Name</option>
                        <option value="author" data-i18n="sort-author">Author</option>
                    </select>
                    <button id="sortReverse" class="sort-reverse" type="button" aria-pressed="false"
                            data-i18n-title="sort-reverse" title="Reverse order">↓</button>
                </div>
            </div>

            <div id="items" class="items-grid"></div>

            <div class="pagination">
                <button id="prevPageBottom" class="btn" disabled>←</button>
                <div id="pageNumbersBottom" class="page-numbers"></div>
                <button id="nextPageBottom" class="btn" disabled>→</button>
            </div>
        </div>

        <div id="authors" class="authors-content" style="display: none;"></div>

        <div id="community" class="community-content" style="display: none;"></div>
    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="lightbox" class="lightbox">
        <span id="lightboxClose" class="lightbox-close">&times;</span>
        <button id="lightboxPrev" class="lightbox-nav lightbox-prev">‹</button>
        <img id="lightboxImg" class="lightbox-image" src="" alt="Fullscreen">
        <button id="lightboxNext" class="lightbox-nav lightbox-next">›</button>
        <div id="lightboxCounter" class="lightbox-counter"></div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="https://discord.gg/HU68TaKCu6" target="_blank" rel="noopener noreferrer" data-umami-event="footer-link-discord">💬 Discord</a>
                <a href="https://docs.lilka.dev" target="_blank" rel="noopener noreferrer" data-umami-event="footer-link-docs">📚 Documentation</a>
                <a href="https://github.com/lilka-dev/catalog" target="_blank" rel="noopener noreferrer" data-umami-event="footer-link-github">🐙 GitHub</a>
            </div>
            <p class="footer-copyright">© 2026 Lilka Project</p>
        </div>
    </footer>

    <!-- Exact versions with integrity hashes: a changed file on the CDN is refused instead of run -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js" integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js" integrity="sha384-eEu5CTj3qGvu9PdJuS+YlkNi7d2XxQROAFYOr59zgObtlcux1ae1Il3u7jvdCSWu" crossorigin="anonymous"></script>
    <script src="script.js"></script>
    <script src="community.js"></script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="70fcef77-656a-4997-80c4-479960fb6530"></script>
</body>
</html>
