name: Build and Deploy to GitHub Pages

# The catalog lives in the API (api/). This workflow publishes the website plus
# a static mirror of the API's /catalog tree, kept on Pages because Keira's
# lilcatalog reads https://catalog.lilka.dev/apps/... and shipped firmware
# cannot change that address.
on:
  push:
    branches: ["main"]
    # API-only changes are deployed by api.yml; they do not change the site
    paths-ignore: ["api/**"]
  workflow_dispatch:
  # The API asks for a rebuild after an approval or an edit
  repository_dispatch:
    types: [api-sync]
  # Safety net for dispatches that never arrived
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.mirror.outputs.changed }}
    env:
      API_URL: ${{ vars.API_URL || 'https://lilka-catalog-api.black-ghost-ukraine.workers.dev' }}
    steps:
      # Actions are pinned to commits: a moved tag cannot change what runs here
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # One API request per run. Hourly and API-triggered runs stop here when
      # the catalog is unchanged; a push always deploys, the site code may have
      - name: Mirror the catalog from the API
        id: mirror
        env:
          MIRROR_SECRET: ${{ secrets.MIRROR_SECRET }}
          SKIP: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && '--skip-unchanged' || '' }}
        run: python3 scripts/mirror_api.py --out build $SKIP

      - name: Copy static site files
        if: steps.mirror.outputs.changed != 'false'
        run: |
          cp site/index.html site/404.html site/styles.css site/script.js site/community.js build/

      - name: Setup Pages
        if: steps.mirror.outputs.changed != 'false'
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      - name: Upload artifact
        if: steps.mirror.outputs.changed != 'false'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: './build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.changed != 'false'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
