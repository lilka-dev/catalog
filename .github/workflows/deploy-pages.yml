name: Build and Deploy to GitHub Pages

# The catalog lives in lilka-catalog-api. This repo is the website plus a
# static mirror of the API's /catalog tree, kept on Pages because Keira's
# lilcatalog reads https://catalog.lilka.dev/apps/... and shipped firmware
# cannot change that address.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # The API asks for a rebuild after an approval or an edit
  repository_dispatch:
    types: [api-sync]
  # Safety net for dispatches that never arrived
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL || vars.COMMUNITY_API_URL || 'https://lilka-catalog-api.black-ghost-ukraine.workers.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mirror the catalog from the API
        run: python3 scripts/mirror_api.py --out build

      - name: Copy static site files
        run: |
          cp site/index.html site/styles.css site/script.js site/community.js build/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
