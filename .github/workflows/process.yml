name: Process uploads

# Scans new versions with ClamAV and generates icon_min, compressed images and
# package.zip (api/scripts/process.py). The API dispatches `scan-version`
# right after an upload; the schedule catches anything a lost dispatch left.
#
# This repository is public, so this log is too: process.py names an item only
# once it is approved and public.
on:
  repository_dispatch:
    types: [scan-version]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      review: ${{ steps.process.outputs.review }}
      infected: ${{ steps.process.outputs.infected }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install and start ClamAV daemon
        # The daemon loads the signatures once; clamscan would reload them per file
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-daemon
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          sudo systemctl start clamav-daemon
          for i in $(seq 1 30); do
            clamdscan --ping 1 2>/dev/null && break
            echo "Waiting for clamd... ($i/30)"
            sleep 2
          done

      - name: Process pending versions
        id: process
        env:
          API_URL: ${{ vars.API_URL || 'https://lilka-catalog-api.black-ghost-ukraine.workers.dev' }}
          SCAN_SECRET: ${{ secrets.SCAN_SECRET }}
        run: python3 scripts/process.py

  # Tells the moderators that something waits for them: one open issue
  # assigned to them, with a comment for every later batch, so GitHub sends an
  # email and a mobile notification. Close the issue once the queue is empty;
  # the next upload opens a new one.
  #
  # A job of its own: only it may write issues, and it never touches the
  # uploaded files. The text holds counts only, nothing an uploader wrote,
  # because the issue is public.
  notify:
    needs: process
    if: ${{ !cancelled() && (needs.process.outputs.review > 0 || needs.process.outputs.infected > 0) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # GitHub logins, comma-separated
      NOTIFY: ${{ vars.MODERATION_NOTIFY || 'black-ghost-off' }}
      REVIEW: ${{ needs.process.outputs.review }}
      INFECTED: ${{ needs.process.outputs.infected }}
      SITE: https://catalog.lilka.dev/?type=mod
    steps:
      - name: Open or update the moderation issue
        run: |
          set -euo pipefail
          [[ "$REVIEW" =~ ^[0-9]*$ && "$INFECTED" =~ ^[0-9]*$ ]] || exit 1
          [[ "$NOTIFY" =~ ^[A-Za-z0-9,-]+$ ]] || { echo "MODERATION_NOTIFY must be logins"; exit 1; }
          mentions=$(echo "$NOTIFY" | tr ',' '\n' | sed '/^$/d; s/^/@/' | paste -sd' ' -)
          body="${REVIEW:-0} new item(s) waiting for review"
          [ "${INFECTED:-0}" -gt 0 ] && body="$body, ${INFECTED} blocked by the antivirus"
          body="$body: $SITE"

          gh label create moderation --color FBCA04 --description "Uploads waiting for a moderator" 2>/dev/null || true
          issue=$(gh issue list --label moderation --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$mentions $body"
          else
            gh issue create --title "Uploads waiting for review" --label moderation \
              --assignee "$NOTIFY" --body "$mentions $body"$'\n\n'"Close this issue once the queue is empty; the next upload opens a new one."
          fi
